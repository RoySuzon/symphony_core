name: symphony_core
description: >-
  A modular, reusable Flutter application core: configuration, a central Dio
  API client with a built-in API inspector, pluggable authentication, GoRouter
  guards, secure storage, a permission-aware dashboard and common UI widgets.
version: 0.1.0
# Set these before publishing to pub.dev:
# homepage: https://github.com/<org>/symphony_core
# repository: https://github.com/<org>/symphony_core
# issue_tracker: https://github.com/<org>/symphony_core/issues

topics:
  - architecture
  - networking
  - authentication
  - routing
  - riverpod

environment:
  # Lowest versions verified by the compatibility test matrix (see COMPATIBILITY.md).
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ">=5.4.0 <6.0.0"
  flutter_riverpod: ">=2.4.0 <4.0.0"
  flutter_secure_storage: ">=9.0.0 <12.0.0"
  go_router: ">=10.0.0 <19.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=3.0.0 <7.0.0"
  mocktail: ">=1.0.0 <2.0.0"

flutter:
